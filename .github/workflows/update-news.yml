name: Update and deploy AI news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Fetch current stories
        run: node scripts/fetch-news.mjs

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No data change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "data: update AI news"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp news.html _site/index.html
          cp data/news.json _site/data/news.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update-news
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
